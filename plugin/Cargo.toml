[package]
name = "typst-smiles-plugin"
version = "0.4.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Element symbols and standard atomic weights. SMILES is read by our own
# parser in src/parser.rs.
ptable = { package = "periodic-table-on-an-enum", version = "0.3" }

# Typst WASM plugin protocol macros
wasm-minimal-protocol = "0.2"

# Serialization for the JSON output returned to Typst
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
